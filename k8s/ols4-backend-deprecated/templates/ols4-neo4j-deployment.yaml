apiVersion: apps/v1
kind: StatefulSet
metadata:
  name:  {{ .Release.Name }}-neo4j
  labels:
    app: {{ .Release.Name }}-neo4j
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-neo4j
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-neo4j
        project: zbmed
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/part-of: {{ .Values.partOfLabel }}
        app.kubernetes.io/component: backend
        app.kubernetes.io/managed-by: Helm
    spec:
      volumes:
        - name: {{ .Release.Name }}-neo4j-storage
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-neo4j-pvc
      containers:
        - name: neo4j
          image: {{.Values.neo4jImage}}
          volumeMounts:
            - mountPath: "/data"
              name: {{ .Release.Name }}-neo4j-storage
          command: ["/bin/bash", "-c"]
          args: ["rm -rf /data/* && NEO4J_TARBALL_URL={{ .Values.neo4jTarballUrl }} && wget -qO- $NEO4J_TARBALL_URL | tar -xz -C /data/ && tini -g -- /startup/docker-entrypoint.sh neo4j"]
          resources:
            requests:
              memory: 2Gi
            limits:
              memory: 20Gi
          env:
            #- name: NEO4J_HEAP_MEMORY
            #  value: 10g
            #- name: NEO4J_dbms_memory_heap_maxSize
            #  value: 8g
            - name: NEO4J_AUTH
              value: none
          ports:
            - containerPort: 7474
            - containerPort: 7687
  serviceName: {{ .Release.Name }}-neo4j
