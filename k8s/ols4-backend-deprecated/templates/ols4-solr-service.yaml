apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-solr
  labels:
    app: {{ .Release.Name }}-solr
    project: zbmed
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: {{ .Values.partOfLabel }}
    app.kubernetes.io/component: backend
    app.kubernetes.io/managed-by: Helm
spec:
  ports:
      - port: 8983
        targetPort: 8983
        name: http
        protocol: TCP
  selector:
    app: {{ .Release.Name }}-solr