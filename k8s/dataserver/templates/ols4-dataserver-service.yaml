apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels:
    app: {{ .Release.Name }}
    project: zbmed
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: {{ .Values.partOfLabel }}
    app.kubernetes.io/component: backend
    app.kubernetes.io/managed-by: Helm
spec:
  ports:
      - port: 80
        targetPort: 80
        name: http
        protocol: TCP
  selector:
    app: {{ .Release.Name }}
